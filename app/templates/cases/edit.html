{% extends "base.html" %}
{% block title %}Edit Case{% endblock %}
{% block header %}Edit Case: {{ case.case_id }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('cases.edit', id=case.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="title" class="form-label">Case title</label>
                        <input type="text" id="title" name="title" maxlength="200" class="form-control bg-dark text-light border-secondary" value="{{ case.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" name="description" class="form-control bg-dark text-light border-secondary" rows="4">{{ case.description or '' }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select id="category" name="category" class="form-select bg-dark text-light border-secondary" required>
                                {% for value in ['Cyber Incident', 'Data Breach', 'Malware Investigation', 'Insider Threat', 'Fraud Investigation', 'Network Investigation', 'Other'] %}
                                <option value="{{ value }}" {% if case.category == value %}selected{% endif %}>{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="priority" class="form-label">Priority</label>
                            <select id="priority" name="priority" class="form-select bg-dark text-light border-secondary" required>
                                {% for value in ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'] %}
                                <option value="{{ value }}" {% if case.priority == value %}selected{% endif %}>{{ value.title() }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    {% if current_user.role == 'ADMIN' %}
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select id="status" name="status" class="form-select bg-dark text-light border-secondary">
                            {% for value in ['OPEN', 'IN_PROGRESS', 'CLOSED', 'ARCHIVED'] %}
                            <option value="{{ value }}" {% if case.status == value %}selected{% endif %}>{{ value.replace('_', ' ').title() }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}
                    <div class="d-flex justify-content-end mt-3">
                        <a href="{{ url_for('cases.view', id=case.id) }}" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-2"></i>Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
