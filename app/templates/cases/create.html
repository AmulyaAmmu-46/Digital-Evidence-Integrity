{% extends "base.html" %}
{% block title %}New Case{% endblock %}
{% block header %}Create New Case{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('cases.create') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Case Title</label>
                        <input type="text" name="title" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control bg-dark text-light border-secondary" rows="4"></textarea>
                    </div>
                    {% if current_user.role == 'ADMIN' %}
                    <div class="mb-3">
                        <label for="assigned_to" class="form-label">Assign investigator</label>
                        <select name="assigned_to" id="assigned_to" class="form-select bg-dark text-light border-secondary">
                            <option value="">Unassigned</option>
                            {% for investigator in investigators %}
                            <option value="{{ investigator.id }}">{{ investigator.full_name }} ({{ investigator.email }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select bg-dark text-light border-secondary" required>
                                <option value="Cyber Incident">Cyber Incident</option>
                                <option value="Data Breach">Data Breach</option>
                                <option value="Malware Investigation">Malware Investigation</option>
                                <option value="Insider Threat">Insider Threat</option>
                                <option value="Fraud Investigation">Fraud Investigation</option>
                                <option value="Network Investigation">Network Investigation</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Priority</label>
                            <select name="priority" class="form-select bg-dark text-light border-secondary" required>
                                <option value="LOW">Low</option>
                                <option value="MEDIUM" selected>Medium</option>
                                <option value="HIGH">High</option>
                                <option value="CRITICAL">Critical</option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end mt-3">
                        <a href="{{ url_for('cases.index') }}" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-2"></i>Create Case</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
